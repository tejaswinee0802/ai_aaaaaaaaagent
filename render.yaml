# One-click Render deployment blueprint for the chwit! reservation app.
# In Render: New -> Blueprint -> select this repo. Render provisions the
# web service and a managed Postgres database and wires DATABASE_URL.
services:
  - type: web
    name: chwit-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chwit-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: chwit-db
    plan: free
